<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudanza de Datos - Bellezas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #F7F4E9;
            color: #2C2520;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #C5944E;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #3A5F40; margin-bottom: 10px; font-size: 22px; }
        p { font-size: 14px; line-height: 1.6; color: #555; margin-bottom: 20px; }
        .status {
            background: #EFECE3;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            text-align: left;
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 25px;
            border: 1px solid #b5b0a1;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(197, 148, 78, 0.2);
            border-top: 4px solid #C5944E;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        .btn-success {
            background: #C5944E;
            color: white;
            border: none;
            padding: 12px 20px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: none;
            width: 100%;
            box-shadow: 0 4px 12px rgba(197, 148, 78, 0.3);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="box">
        <div id="loading-icon" class="spinner"></div>
        <h2 id="migration-title">Migración en Progreso</h2>
        <p id="migration-text">Conectando con Firestore antiguo para recuperar tus categorías y la lista de productos...</p>
        
        <div class="status" id="log-status">
            > Iniciando asistente de mudanza...<br>
        </div>

        <button class="btn-success" id="btn-finalizar" onclick="alert('Paso completado. Ahora vuelve a GitHub y pega el código original de tu catálogo.')">
            ¡Mudanza Completada con Éxito! 🎉
        </button>
    </div>

    <!-- SDK de Firebase v9 para la importación -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Tus credenciales actuales de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD8_-NFb0q903-wOP2xnr_faqka-G8Lo6k",
            authDomain: "bellezas-fa52a.firebaseapp.com",
            databaseURL: "https://bellezas-fa52a-default-rtdb.firebaseio.com",
            projectId: "bellezas-fa52a",
            storageBucket: "bellezas-fa52a.firebasestorage.app",
            messagingSenderId: "1074680332863",
            appId: "1:1074680332863:web:4c85d487fc4c59a01c2e8a"
        };

        const app = initializeApp(firebaseConfig);
        const firestoreDb = getFirestore(app);
        const realtimeDb = getDatabase(app);

        const log = document.getElementById("log-status");

        function addLog(text) {
            log.innerHTML += `> ${text}<br>`;
            log.scrollTop = log.scrollHeight;
        }

        async function iniciarMudanza() {
            try {
                addLog("Leyendo datos desde Firestore antiguo...");
                // Referencia exacta al documento que se ve en la captura
                const docRef = doc(firestoreDb, "config_bellezas", "config_bellezas");
                const snapshot = await getDoc(docRef);

                if (snapshot.exists()) {
                    const datosAnteriores = snapshot.data();
                    addLog("¡Datos localizados con éxito!");
                    
                    // Extraer arrays garantizando que no se caiga si vienen vacíos
                    const categoriasRecuperadas = datosAnteriores.categorias || [];
                    const productosRecuperados = datosAnteriores.productos || [];
                    const claveRecuperada = datosAnteriores.clave || "2122";

                    addLog(`Detectadas: ${categoriasRecuperadas.length} categorías.`);
                    addLog(`Detectados: ${productosRecuperados.length} productos en inventario.`);

                    // Estructura limpia para inyectar en la Realtime Database
                    const nuevoEsquema = {
                        clave: claveRecuperada,
                        tasa: 45.50, // Mantenemos tu tasa base por defecto
                        telefono: "584124111357", // Tu número de WhatsApp registrado
                        categorias: categoriasRecuperadas,
                        productos: productosRecuperados
                    };

                    addLog("Escribiendo datos en la nueva Realtime Database...");
                    const rtdbRef = ref(realtimeDb, "config_bellezas");
                    await set(rtdbRef, nuevoEsquema);

                    // Éxito absoluto
                    addLog("💥 Datos sincronizados correctamente.");
                    document.getElementById("loading-icon").style.display = "none";
                    document.getElementById("migration-title").innerText = "¡Proceso Terminado!";
                    document.getElementById("migration-text").innerText = "Tus productos antiguos (Baggi, Bolso viajero, etc.) ya están a salvo en la base de datos veloz.";
                    document.getElementById("btn-finalizar").style.display = "block";

                } else {
                    addLog("❌ Error: No se encontró el documento de origen en Firestore.");
                    document.getElementById("migration-title").innerText = "Fallo en la Mudanza";
                }
            } catch (error) {
                console.error(error);
                addLog(`❌ Error crítico durante el proceso: ${error.message}`);
                document.getElementById("migration-title").innerText = "Error en la Conexión";
            }
        }

        // Ejecutar al cargar la página
        iniciarMudanza();
    </script>
</body>
</html>
